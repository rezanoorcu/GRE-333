<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Master GRE vocabulary with 333 high-frequency words, meanings, pronunciation, and interactive learning">
    <meta name="theme-color" content="#1e293b">
    <title>GRE 333 - High Frequency Words</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/launchericon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/launchericon-512x512.png">
    <link rel="apple-touch-icon" href="/launchericon-192x192.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('ServiceWorker registered:', registration.scope);
            })
            .catch((error) => {
              console.log('ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
